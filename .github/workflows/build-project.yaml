name: Build Project
# Builds the OBS plugin for Windows and its installer, OBS-Director-<version>-Windows-Setup.exe.
on:
  workflow_call:
permissions:
  contents: read
jobs:
  windows-build:
    name: Build for Windows 🪟
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    env:
      # main is what gets published as a release, so it builds the Release config
      CONFIG: ${{ (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) && 'Release' || 'RelWithDebInfo' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          # Set Up Environment 🔧
          if ( $Env:RUNNER_DEBUG -ne $null ) {
            Set-PSDebug -Trace 1
          }

          $BuildSpec = Get-Content -Path buildspec.json -Raw | ConvertFrom-Json
          "pluginVersion=$($BuildSpec.version)" >> $env:GITHUB_OUTPUT

      - name: Build Plugin 🧱
        uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: ${{ env.CONFIG }}

      - name: Build Installer 📀
        uses: ./.github/actions/package-plugin
        with:
          target: x64
          config: ${{ env.CONFIG }}

      - name: Upload Installer 📡
        uses: actions/upload-artifact@v4
        with:
          name: obs-director-windows-${{ steps.setup.outputs.pluginVersion }}
          path: ${{ github.workspace }}/release/OBS-Director-${{ steps.setup.outputs.pluginVersion }}-Windows-Setup.exe
          if-no-files-found: error

      - name: Upload Debug Symbols 🪲
        uses: actions/upload-artifact@v4
        with:
          name: obs-director-windows-${{ steps.setup.outputs.pluginVersion }}-pdb
          path: ${{ github.workspace }}/release/${{ env.CONFIG }}/obs-director/*.pdb
          if-no-files-found: ignore
