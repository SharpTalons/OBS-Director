name: Android App
on:
  workflow_call:
    outputs:
      version:
        description: Version from buildspec.json
        value: ${{ jobs.android.outputs.version }}
  workflow_dispatch:
jobs:
  android:
    name: Build Android App 🤖
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Read Version 🏷️
        id: version
        run: |
          version="$(jq -r .version buildspec.json)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building OBS Director ${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match buildspec.json version ${version}"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Set Up Signing 🔑
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "${KEYSTORE_BASE64}" ]]; then
            echo "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
            echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"
            echo "Release signing key found."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the release APK is signed with a throwaway debug key, so in-app updates won't install over it. See README, Building."
          fi

      - name: Build APK 🧱
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee "${RUNNER_TEMP}/gradle.log"

      - name: Report Build Errors 🪲
        if: failure()
        run: |
          log="${RUNNER_TEMP}/gradle.log"
          [[ -f "$log" ]] || exit 0
          # Kotlin and Android resource errors as annotations on the commit
          grep -E '^e: |error:|ERROR:|FAILURE:|What went wrong' "$log" | head -40 | while IFS= read -r line; do
            if [[ "$line" =~ ^e:\ file://([^:]+):([0-9]+):([0-9]+)\ (.*)$ ]]; then
              f="${BASH_REMATCH[1]#${GITHUB_WORKSPACE}/}"
              echo "::error file=${f},line=${BASH_REMATCH[2]},col=${BASH_REMATCH[3]}::${BASH_REMATCH[4]}"
            else
              echo "::error::${line}"
            fi
          done
          {
            echo '### Android build failed'
            echo '```'
            grep -E -A3 '^e: |error:|What went wrong' "$log" | head -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rename APK 🏷️
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/obs-director-android-${{ steps.version.outputs.version }}.apk"
          ls -la release

      - name: Upload APK 📡
        uses: actions/upload-artifact@v4
        with:
          name: obs-director-android-${{ steps.version.outputs.version }}
          path: release/obs-director-android-*.apk
