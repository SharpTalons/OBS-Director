<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>OBS Director</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<div id="app" class="shell">
  <header class="head">
    <span class="mark" aria-hidden="true"><span></span></span>
    <div class="head-text">
      <div class="head-title">OBS Director</div>
      <div class="head-status"><span id="link-dot" class="dot"></span><span id="link-line">Connecting…</span></div>
    </div>
    <span id="browser-name" class="head-browser"></span>
    <button id="stage-open" class="round" type="button" aria-label="Stage mode" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h9v5a4.5 4.5 0 0 1-9 0z"/><path d="M5.5 7h.01M9.5 7h.01M6 10.3c1 .8 2 .8 3 0"/><path d="M12 10h9v5a4.5 4.5 0 0 1-9 0z"/><path d="M14.5 13h.01M18.5 13h.01M15 17.2c1-.8 2-.8 3 0"/></svg>
    </button>
  </header>
  <div id="banners" class="banners" aria-live="polite"></div>
  <div id="view" class="view"></div>
  <div id="toast" class="toast" role="status" hidden></div>
</div>
<noscript><p class="noscript">OBS Director needs JavaScript switched on in this browser.</p></noscript>
</body>
</html>
